name: Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  checks:
    name: Lint, type check and unit tests
    # Windows, unlike the template's other workflows: the type check needs wxPython, which
    # PyPI ships as wheels for Windows and macOS only (the Linux sdist compiles wxWidgets
    # from source), and the add-on itself only ever runs on Windows, so the unit tests meet
    # the file system they will run on.
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint and format
        run: uv run prek run --all-files

      # The shell of the add-on resolves only against NVDA's own source, which is why
      # pyproject.toml excludes it from the default pyright configuration. wxPython, the
      # other thing the windows import, came in with `uv sync` above.
      #
      # Which NVDA that source is comes from `addon_lastTestedNVDAVersion` in buildVars.py,
      # never from a number written here, which would drift away from the field that sets
      # it. `tools/nvda_ref.py` does the mapping and says why the default branch is the
      # wrong thing to check against. `bash` is here to fail fast: pwsh checks the exit
      # code once, at the end of the script, so a clone that failed would carry on into
      # pyright -- which reports unresolved imports and so fails for the wrong reason.
      - name: Type check the add-on against NVDA's source
        shell: bash
        run: |
          ref="$(uv run python -m tools.nvda_ref)"
          echo "Checking against NVDA $ref"
          git clone --depth 1 --branch "$ref" https://github.com/nvaccess/nvda.git ../nvda
          uv run pyright --project pyrightconfig.ci.json

      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v
