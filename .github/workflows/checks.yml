name: Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:
  checks:
    name: Lint, type check and unit tests
    # Windows, unlike the template's other workflows: the type check needs wxPython, which
    # PyPI ships as wheels for Windows and macOS only (the Linux sdist compiles wxWidgets
    # from source), and the add-on itself only ever runs on Windows, so the unit tests meet
    # the file system they will run on.
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint and format
        run: uv run prek run --all-files

      # The shell of the add-on resolves only against NVDA's own source, which is why
      # pyproject.toml excludes it from the default pyright configuration. wxPython, the
      # other thing the windows import, came in with `uv sync` above.
      - name: Type check the add-on against NVDA's source
        run: |
          git clone --depth 1 https://github.com/nvaccess/nvda.git ../nvda
          uv run pyright --project pyrightconfig.ci.json

      - name: Unit tests
        run: uv run python -m unittest discover -s tests -v
