name: build addon

on:
  push:
    # A tag publishes: `upload_release` below turns it into a GitHub release.
    # Development builds are deliberately not published, since the working copy
    # is tested through the development link (docs/development.md).
    tags: ["v*"]

    # A push to a release or hotfix branch builds and publishes nothing. This
    # runner is the one the tag will get -- Linux, gettext from apt -- and it is
    # the only place `scons` runs anywhere but Windows, so what breaks here alone
    # would otherwise first break on the tag: after `main` has moved and the tag
    # is set, when a failure costs deleting the release and the tag rather than
    # one more commit on the branch. docs/development.md, section 7, waits for
    # this run before the branch is finished.
    #
    # Calling this file from `release_checks.yml` through `workflow_call` was the
    # alternative. GitHub checks the permissions of a called workflow statically,
    # skipped jobs included, so the caller would have to grant `contents: write`
    # for `upload_release` -- a job that never runs off a branch -- and the build
    # would carry a write token it has no use for.
    branches: ["release/**", "hotfix/**"]

  pull_request:
    branches: [ main, develop ]

  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true
    - name: Install dependencies
      run: |
        sudo apt-get update  -y
        sudo apt-get install -y gettext
        uv sync

    - name: building addon
      run: uv run scons && uv run scons pot

    - uses: actions/upload-artifact@v7
      with:
        name: packaged_addon
        path: |
          ./*.nvda-addon
        archive: false

    - uses: actions/upload-artifact@v7
      with:
        name: translation_template
        path: |
          ./*.pot
        archive: false

  upload_release:
    runs-on: ubuntu-latest
    # Off a branch push or a pull request only `build` above runs.
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: ["build"]
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v7
    - name: download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: .
        merge-multiple: true
    - name: Display structure of downloaded files
      run: ls -R
    - name: Calculate sha256
      run: |
        echo -e "\nSHA256: " >> changelog.md
        sha256sum *.nvda-addon >> changelog.md

    # No `prerelease` condition here: the Add-on Store validator requires the
    # version to be `X.Y` or `X.Y.Z` with integer parts, so a suffixed tag such
    # as `v0.2.0-rc1` could never be published anyway. Every `v*` tag is a full
    # release. See docs/development.md, section 7.
    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          *.nvda-addon
          *.pot
        body_path: changelog.md
        fail_on_unmatched_files: true
